name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # Full history: the evidence gate recomputes each release's obligations
      # from the diff against the previous release's commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # scripts/ had no CI coverage at all until 0.1.336: a syntax error in either
      # script would have shipped silently, including into the emergency merge
      # path that runs when CI itself is unavailable. compileall, not a file
      # list: the hand-maintained list this replaced had rotted to 26 of 29
      # scripts — it omitted preflight.py, review_scores.py and sea_route.py —
      # and a glob cannot rot. -f forces recompile so a cached .pyc can never
      # mask a fresh syntax error.
      - run: python3 -m compileall -q -f scripts/
      - run: bash -n scripts/ops/emergency_merge.sh scripts/ops/ci_wait.sh
      # Dev tools, pinned in requirements-dev.txt so local (via preflight) and
      # CI always lint with the same versions. The DELIVERABLE path stays
      # zero-dependency: nothing in scripts/ imports any of these at runtime.
      - run: python3 -m pip install -q -r requirements-dev.txt
      # ruff's S rules (flake8-bandit) are the Python security scan.
      - run: python3 -m ruff check .
      - run: python3 -m mypy
      # `-n auto` (pytest-xdist): the suite is the single slowest CI step by a
      # wide margin and had been running serially on a multi-core runner.
      - run: python3 -m pytest -q -n auto
      # Both JavaScript surfaces — the tracked assets/**.js runtimes and the
      # probe strings embedded in inspect_layout.py — parsed by `node --check`.
      # Until 0.1.416 neither had any syntax gate (0.1.414: "the guard shipped
      # in Python, the runtime is JavaScript").
      - run: python3 scripts/check/check_js.py
      # Every vendored asset must stay byte-identical: a silent change would alter
      # the metrics or the marks of every deliverable that embeds it. The icons
      # and geography arrived in 0.1.338 under the same reasoning as the face.
      - run: python3 scripts/build/embed_font.py --check
      - run: python3 scripts/build/embed_icons.py --check
      - run: python3 scripts/build/build_geography.py --check
      - run: python3 scripts/build/build_worldmap.py --check
      - run: python3 scripts/build/build_brand.py --check
      - run: python3 scripts/build/build_trade_registry.py --check
      # The delivery folder holds records, not renders. In CI there is no
      # delivery folder and this skips and says so; the value is local, in
      # preflight, where the folder exists and grew to 349MB of page rasters
      # twice in a fortnight. Reading the step list is how preflight learns
      # to run it at all, so it is declared here rather than there.
      - run: python3 scripts/ops/housekeeping.py --check
      - run: python3 scripts/build/build_region_palette.py --check
      - run: python3 scripts/build/recolor_shapes.py --check
      # The maths properties, plus the JS port held to the Python authority
      # over the 1300-sample golden grid under bare node (projection.js is
      # DOM-free). The remaining browser checks (renderer parity, painted
      # ink) stay operator steps recorded via the evidence gate.
      - run: python3 scripts/check/check_globe.py --python-only --node
      - run: python3 scripts/build/embed_globe.py --check
      - run: python3 scripts/build/embed_regionmap.py --check
      # Ordering matters: a stale generated tree must report as stale rather
      # than as a mystery failure in a guard that reads it.
      - run: python3 scripts/build/build_entrypoints.py --check
      - run: python3 scripts/build/build_fixtures.py --check
      # The eval inventory is generated FROM the checkers, so a checker
      # change regenerates it or this refuses. It runs after the fixture
      # check because it measures the passing fixture to read the row tables.
      - run: python3 scripts/build/build_eval_inventory.py --check
      # The trace store's dictionary and index. Every field's meaning otherwise
      # lives only in a comment inside trace_schema.py. The directory held
      # three times more files than records when this step was added at
      # 0.1.631; 0.1.632 deleted the 182 that recorded nothing, so it is one
      # file per record today — which is a fact that can change again, and the
      # generated README is where it is counted rather than here.
      - run: python3 scripts/build/build_trace_dictionary.py --check
      # The rule register and the page contracts generated from it. The
      # register is hand-written, so the check is that it has not gone stale
      # against the rules it quotes or the checkers it names — including the
      # reverse direction, a gate no rule asks for.
      - run: python3 scripts/check/check_rule_coverage.py --check
      - run: python3 scripts/build/build_page_contracts.py --check
      # The build card: the decidable half of the rules, generated so it
      # cannot become a third copy of them.
      - run: python3 scripts/build/build_card.py --check
      # The shape library's own measurements: 206 non-zero origins that an
      # author would otherwise have to read out of the SVGs one by one.
      - run: python3 scripts/build/build_shape_geometry.py --check
      # The gates, tested. Runs after the staleness checks so a stale
      # fixture reports as stale rather than as a metric regression.
      - run: python3 scripts/check/check_fixtures.py
      # Parses the suite only. It cannot invoke an agent — no keys, no
      # network, no vendor SDKs — and must never look as though it did.
      - run: python3 scripts/ops/run_conformance.py validate
      # The multi-agent board is DERIVED from the trace store and history.json,
      # so CI holds the written file to what those two say. It verifies the
      # derivation and never the measurement — the same limit `validate` above
      # has, said in the same words on purpose.
      - run: python3 scripts/ops/agent_evals.py board --check
      # README ships to users, so the one table in it that names vendor model
      # strings is generated from the same derivation and held to it here. A
      # hand-written version of this block would be a rotting claim in a
      # consumer file with no forcing function.
      - run: python3 scripts/build/build_readme_configs.py --check
      # What CI cannot execute must be recorded as an execution, not a
      # sentence (GAP-002, closed 0.1.425). Red since 0.1.425 after one
      # warn-only release proved every failure shape fires.
      - run: python3 scripts/check/check_evidence.py --check
      - run: python3 scripts/ops/review_scores.py --check
      - run: python3 scripts/ops/eval_agreement.py --report
      - run: python3 scripts/check/check_repo.py
