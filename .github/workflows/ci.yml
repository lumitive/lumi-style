name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Standard library only — no dependency step, nothing to pin or update.
      # scripts/ had no CI coverage at all until 0.1.336: a syntax error in either
      # script would have shipped silently, including into the emergency merge
      # path that runs when CI itself is unavailable.
      - run: |
          python3 -m py_compile \
            scripts/check_repo.py scripts/check_prose.py scripts/check_design.py \
            scripts/embed_font.py scripts/embed_icons.py scripts/build_geography.py \
            scripts/geo_projection.py scripts/build_worldmap.py \
            scripts/build_region_palette.py scripts/build_trade_registry.py \
            scripts/build_brand.py scripts/lock.py scripts/new_deck.py \
            scripts/check_globe.py \
            scripts/globe_svg.py scripts/geo_frame.py scripts/embed_globe.py \
            scripts/regionmap_svg.py scripts/embed_regionmap.py \
            scripts/build_entrypoints.py scripts/inspect_layout.py \
            scripts/build_fixtures.py scripts/check_fixtures.py \
            scripts/run_conformance.py scripts/export_pdf.py \
            scripts/output_dir.py
      - run: bash -n scripts/emergency_merge.sh scripts/ci_wait.sh
      # Every vendored asset must stay byte-identical: a silent change would alter
      # the metrics or the marks of every deliverable that embeds it. The icons
      # and geography arrived in 0.1.338 under the same reasoning as the face.
      - run: python3 scripts/embed_font.py --check
      - run: python3 scripts/embed_icons.py --check
      - run: python3 scripts/build_geography.py --check
      - run: python3 scripts/build_worldmap.py --check
      - run: python3 scripts/build_brand.py --check
      - run: python3 scripts/build_trade_registry.py --check
      - run: python3 scripts/build_region_palette.py --check
      # The maths properties only. The JS port needs a browser, so like
      # check_prose/check_design/inspect_layout its full run is an
      # operator step; --python-only is the half a runner can do.
      - run: python3 scripts/check_globe.py --python-only
      - run: python3 scripts/embed_globe.py --check
      - run: python3 scripts/embed_regionmap.py --check
      # Ordering matters: a stale generated tree must report as stale rather
      # than as a mystery failure in a guard that reads it.
      - run: python3 scripts/build_entrypoints.py --check
      - run: python3 scripts/build_fixtures.py --check
      # The gates, tested. Runs after the staleness checks so a stale
      # fixture reports as stale rather than as a metric regression.
      - run: python3 scripts/check_fixtures.py
      # Parses the suite only. It cannot invoke an agent — no keys, no
      # network, no vendor SDKs — and must never look as though it did.
      - run: python3 scripts/run_conformance.py validate
      - run: python3 scripts/check_repo.py
